name: Asumi Search Regression

on:
  pull_request:
    paths:
      - "features/assistant/**"
      - "features/tarot/**"
      - "tests/test_tarot_inline_ui.py"
      - "tests/test_tarot_v2_session.py"
      - "tests/test_tarot_v2_renderer.py"
      - "features/summary/**"
      - "features/feedback/**"
      - "tests/test_feedback_t23.py"
      - "tests/test_feedback_t23_review.py"
      - "tests/test_feedback_t23_db_schema.py"
      - "tests/test_feedback_ticket_numbers.py"
      - "tests/test_feedback_user_lifecycle.py"
      - "features/feedback/user_views.py"
      - "tests/test_feedback_evidence_reader.py"
      - "tests/test_feedback_review_proposals.py"
      - "tests/test_feedback_t23_completion.py"
      - "tests/test_feedback_mcp.py"
      - "tests/test_feedback_oauth.py"
      - "tests/test_t24_admin_console.py"
      - "web/**"
      - "docs/T23_FEEDBACK_CONNECTOR_OPENAPI.yaml"
      - "bot_instance.py"
      - "tests/test_assistant_brave.py"
      - "tests/test_assistant_history.py"
      - "tests/test_assistant_temporal_history.py"
      - "tests/test_assistant_search_followup.py"
      - "tests/test_assistant_policy_config.py"
      - "tests/test_assistant_search_ux.py"
      - "tests/test_assistant_source_verification.py"
      - "tests/test_assistant_fact_answers.py"
      - "tests/test_assistant_public_pages.py"
      - "tests/test_assistant_fuel_aggregate.py"
      - "tests/test_assistant_fact_answers.py"
      - "tests/test_assistant_source_routing.py"
      - "tests/test_assistant_multisource.py"
      - "tests/test_assistant_clef_acceptance.py"
      - "tests/test_assistant_member_summary.py"
      - ".github/workflows/asumi-search.yml"
  push:
    branches: [main]
    paths:
      - "features/assistant/**"
      - "features/tarot/**"
      - "tests/test_tarot_inline_ui.py"
      - "tests/test_tarot_v2_session.py"
      - "tests/test_tarot_v2_renderer.py"
      - "features/summary/**"
      - "features/feedback/**"
      - "tests/test_feedback_t23.py"
      - "tests/test_feedback_t23_review.py"
      - "tests/test_feedback_t23_db_schema.py"
      - "tests/test_feedback_ticket_numbers.py"
      - "tests/test_feedback_user_lifecycle.py"
      - "features/feedback/user_views.py"
      - "tests/test_feedback_evidence_reader.py"
      - "tests/test_feedback_review_proposals.py"
      - "tests/test_feedback_t23_completion.py"
      - "tests/test_feedback_mcp.py"
      - "tests/test_feedback_oauth.py"
      - "web/**"
      - "docs/T23_FEEDBACK_CONNECTOR_OPENAPI.yaml"
      - "bot_instance.py"
      - "tests/test_assistant_brave.py"
      - "tests/test_assistant_history.py"

jobs:
  search-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          # audioop-lts targets Python 3.13+; Python 3.12 still ships audioop.
          grep -v '^audioop-lts' requirements.txt > /tmp/asumi-search-requirements.txt
          python -m pip install -r /tmp/asumi-search-requirements.txt
      - name: Test Brave Search and Discord History
        env:
          ADMIN_PASSWORD: ci-only-placeholder
          FLASK_SECRET_KEY: ci-only-placeholder-not-a-production-secret
        run: |
          python -m unittest discover -s tests -p "test_tarot_inline_ui.py" -v
          python -m unittest discover -s tests -p "test_tarot_v2_session.py" -v
          python -m unittest discover -s tests -p "test_tarot_v2_renderer.py" -v
          python -m unittest discover -s tests -p "test_assistant_brave.py" -v
          python -m unittest discover -s tests -p "test_assistant_history.py" -v
          python -m unittest discover -s tests -p "test_assistant_temporal_history.py" -v
          python -m unittest discover -s tests -p "test_assistant_search_followup.py" -v
          python -m unittest discover -s tests -p "test_assistant_policy_config.py" -v
          python -m unittest discover -s tests -p "test_assistant_search_ux.py" -v
          python -m unittest discover -s tests -p "test_assistant_source_verification.py" -v
          python -m unittest discover -s tests -p "test_assistant_fact_answers.py" -v
          python -m unittest discover -s tests -p "test_assistant_public_pages.py" -v
          python -m unittest discover -s tests -p "test_assistant_fuel_aggregate.py" -v
          python -m unittest discover -s tests -p "test_assistant_source_routing.py" -v
          python -m unittest discover -s tests -p "test_assistant_multisource.py" -v
          python -m unittest discover -s tests -p "test_assistant_clef_acceptance.py" -v
          python -m unittest discover -s tests -p "test_assistant_member_summary.py" -v
          python -m unittest discover -s tests -p "test_feedback_t23.py" -v
          python -m unittest discover -s tests -p "test_feedback_t23_review.py" -v
          python -m unittest discover -s tests -p "test_feedback_t23_db_schema.py" -v
          python -m unittest discover -s tests -p "test_feedback_ticket_numbers.py" -v
          python -m unittest discover -s tests -p "test_feedback_user_lifecycle.py" -v
          python -m unittest discover -s tests -p "test_feedback_evidence_reader.py" -v
          python -m unittest discover -s tests -p "test_feedback_review_proposals.py" -v
          python -m unittest discover -s tests -p "test_feedback_t23_completion.py" -v
          python -m unittest discover -s tests -p "test_feedback_mcp.py" -v
          python -m unittest discover -s tests -p "test_feedback_oauth.py" -v
          python -m unittest discover -s tests -p "test_t24_admin_console.py" -v
          python -m compileall -q features/tarot features/assistant features/feedback web/app.py
          python - <<'PY'
          from pathlib import Path
          source=Path("web/templates/feedback.html").read_text(encoding="utf-8")
          js=source.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/asumi-t23-admin.js").write_text(js,encoding="utf-8")
          PY
          node --check /tmp/asumi-t23-admin.js
          node --check web/static/admin_console.js
          python - <<'PY'
          from pathlib import Path
          source = Path("web/templates/dashboard.html").read_text(encoding="utf-8")
          Path("/tmp/asumi-classic-admin.js").write_text(
              source.rsplit("<script>", 1)[1].split("</script>", 1)[0], encoding="utf-8"
          )
          PY
          node --check /tmp/asumi-classic-admin.js
          python -m unittest discover -s tests -p "test_assistant_core.py" -v
          python -m unittest discover -s tests -p "test_assistant_archive.py" -v
          python -m unittest discover -s tests -p "test_assistant_semantic.py" -v

      - name: Observe fuel source availability (informational only)
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request
          from features.assistant.providers.webgia_prices import parse_webgia_fuel
          urls = [
              ("official", "https://www.pvoil.com.vn/tin-gia-xang-dau"),
              ("webgia", "https://webgia.tv/xang-dau/petrolimex"),
          ]
          for label, url in urls:
              try:
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "AsumiBot/3.7.7", "Accept": "text/html"
                  })
                  with urllib.request.urlopen(req, timeout=6) as response:
                      body = response.read(180000)
                      print(f"{label} status={response.status}")
                      if label == "webgia":
                          parsed = parse_webgia_fuel(body.decode("utf-8", "replace"))
                          print("webgia parsed=", parsed.status,
                                "date=", parsed.effective_date,
                                "items=", len(parsed.rows))
              except Exception as exc:
                  print(f"{label} error={type(exc).__name__}: {str(exc)[:140]}")
          PY
