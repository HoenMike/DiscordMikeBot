<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="csrf-token" content="{{ feedback_csrf }}"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Asumi Feedback Inbox</title>
  <style>
  :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#10141d;color:#e5eaf3}
  body{max-width:1120px;margin:35px auto;padding:0 20px}
  a{color:#8cbcff}header{display:flex;justify-content:space-between;align-items:center}
  select,input,textarea,button{font:inherit;border:1px solid #49556c;border-radius:9px;background:#1d2735;color:inherit;padding:9px}
  button{cursor:pointer}button:hover{background:#29364b}
  button.primary{background:#2661ab;border-color:#3978bd}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:22px}
  .panel{border:1px solid #334257;border-radius:14px;padding:17px;background:#19212d}
  .entry{display:block;width:100%;text-align:left;margin:0 0 9px}
  .active{border-color:#8cbcff}
  .muted{color:#a5b5ca}.small{font-size:12px}textarea{width:100%;box-sizing:border-box;min-height:86px}
  .toolbar{display:flex;gap:10px;align-items:center;margin:12px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .description{white-space:pre-wrap;overflow-wrap:anywhere}
  .image{max-width:210px;max-height:150px;object-fit:contain;margin:8px;border:1px solid #415267;border-radius:8px}
  @media(max-width:730px){.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div><h2>Asumi · Feedback Inbox</h2><span class="muted">T23 · Duyệt, từ chối và theo dõi ticket</span></div>
    <a href="/admin">← Dashboard</a>
  </header>
  <div class="toolbar">
    <label for="filter">Trạng thái</label>
    <select id="filter">
      <option value="">Tất cả</option><option>submitted</option><option>triage</option>
      <option>needs_info</option><option>approved</option><option>rejected</option>
      <option>duplicate</option><option>deferred</option><option>in_progress</option>
      <option>deployed</option><option>verified</option><option>closed</option>
    </select>
    <button onclick="reload()">Làm mới</button>
    <span id="message" class="muted small"></span>
  </div>
  <div class="layout">
    <section class="panel"><h3>Tickets</h3><div id="entries">Đang tải…</div></section>
    <section class="panel" id="detail"><p class="muted">Chọn một ticket để xem chi tiết.</p></section>
  </div>
<script>
let tickets=[],selected=null;
function node(tag,text){const n=document.createElement(tag);n.textContent=String(text??'');return n}
async function reload(){
  const message=document.getElementById('message');
  message.textContent='Đang tải...';
  try{
    const status=document.getElementById('filter').value;
    const response=await fetch('/api/admin/feedback?limit=100&status='+encodeURIComponent(status),{credentials:'same-origin'});
    if(!response.ok)throw Error('HTTP '+response.status);
    const data=await response.json(); tickets=data.tickets||[];
    const entries=document.getElementById('entries');entries.replaceChildren();
    for(const t of tickets){
      const b=node('button',t.id+' · '+t.category+' · '+t.status+'\n'+t.title);
      b.className='entry'+(selected===t.id?' active':'');
      b.onclick=()=>choose(t.id);entries.append(b)
    }
    if(!tickets.length)entries.append(node('p','Chưa có feedback phù hợp.'));
    message.textContent=tickets.length+' ticket';
    if(selected){if(tickets.some(t=>t.id===selected))choose(selected);else selected=null}
  }catch(e){message.textContent='Không lấy được dữ liệu ('+e.message+')'}
}
function add(parent,tag,text){const n=node(tag,text);parent.append(n);return n}
function choose(id){
  selected=id;const t=tickets.find(x=>x.id===id);if(!t)return;
  const area=document.getElementById('detail');area.replaceChildren();
  add(area,'h3',t.id+' · '+t.title);
  add(area,'p','Trạng thái: '+t.status+' · '+t.category+' · Asumi '+t.bot_version);
  add(area,'p','Người báo: '+t.reporter_id+' · Ngày: '+t.created_at).className='muted small';
  add(area,'h4','Nội dung báo cáo');
  add(area,'p',t.description).className='description';
  if(t.user_explanation){add(area,'h4','Giải thích của người dùng');add(area,'p',t.user_explanation).className='description'}
  if(t.reason){add(area,'h4','Lý do xử lý hiện tại');add(area,'p',t.reason).className='description'}
  const attachments=t.evidence||[];
  if(attachments.length){
    add(area,'h4','Ảnh đính kèm ('+attachments.length+')');
    for(let i=0;i<attachments.length;i++){
      const a=document.createElement('a');a.href='/api/admin/feedback/'+encodeURIComponent(id)+'/evidence/'+i;
      a.target='_blank';a.rel='noopener';a.textContent='Mở ảnh '+(i+1)+' (yêu cầu đăng nhập)';
      area.append(a);area.append(node('span',' · '));
    }
  }
  add(area,'h4','Quyết định');
  const options=['triage','needs_info','approved','rejected','duplicate','deferred','planned','in_progress','in_review','deployed','verified','closed','reopened'];
  const select=document.createElement('select');for(const x of options){const option=node('option',x);option.value=x;select.append(option)}select.value=t.status;area.append(select);
  const textarea=document.createElement('textarea');textarea.placeholder='Lý do / hướng giải quyết (bắt buộc nếu reject, defer, duplicate, needs_info, verified)';area.append(textarea);
  const version=document.createElement('input');version.placeholder='Phiên bản verified (nếu chọn verified)';area.append(version);
  const btn=node('button','Lưu quyết định');btn.className='primary';
  btn.onclick=async()=>{
    if(!window.confirm('Xác nhận cập nhật ticket '+id+'?'))return;
    try{
      const response=await fetch('/api/admin/feedback/'+encodeURIComponent(id)+'/review',{
        method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name=csrf-token]').content},
        credentials:'same-origin',body:JSON.stringify({status:select.value,reason:textarea.value,verified_version:version.value})
      });
      const result=await response.json();if(!response.ok)throw Error(result.error||response.status);
      await reload();
    }catch(e){window.alert('Lưu thất bại: '+e.message)}
  };
  area.append(btn);
  document.querySelectorAll('.entry').forEach(b=>b.classList.toggle('active',b.textContent.startsWith(id+' ·')));
}
document.getElementById('filter').onchange=reload;reload();
</script>
</body></html>
